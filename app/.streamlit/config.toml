[server]
# Fix for macOS threading issues with TensorFlow
enableCORS = false
enableXsrfProtection = false

[runner]
# Prevent file watcher issues on macOS
fastReruns = false
magicEnabled = true

[client]
# Browser settings
showErrorDetails = true
toolbarMode = "minimal"

[theme]
# Consistent UI theme across all pages
primaryColor = "#0066CC"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"
